<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رصد الحضور السريع</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--pri:#0284c7;--ok:#10b981;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;width:320px;background:var(--bg);color:var(--txt);font-family:Tahoma,"Segoe UI",sans-serif;font-size:13px}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  header b{font-size:15px}
  header small{display:block;color:var(--mut);margin-top:3px}
  main{padding:12px 16px 14px}
  .opt{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--card)}
  .opt input{margin:0}
  .opt.on{border-color:var(--pri)}
  textarea{width:100%;min-height:92px;resize:vertical;background:var(--card);color:#f1f5f9;border:1px solid #475569;border-radius:8px;padding:8px;font:inherit}
  .hint{color:var(--mut);font-size:11.5px;margin:6px 0 4px}
  #absBox{display:none;margin-bottom:10px}
  button{width:100%;border:none;border-radius:8px;padding:11px;font:inherit;font-weight:bold;cursor:pointer}
  #quick{background:var(--ok);color:#fff;font-size:14px;margin-top:4px}
  #open{background:var(--line);color:var(--txt);margin-top:8px;font-weight:normal}
  button:disabled{opacity:.55;cursor:default}
  #status{margin-top:10px;min-height:18px;font-size:12px;color:var(--mut);line-height:1.6}
  #status.err{color:#f87171}#status.ok{color:#34d399}
  footer{padding:8px 16px 12px;color:#64748b;font-size:11px;text-align:center}
</style>
</head>
<body>
<header>
  <b>⚡ رصد الحضور السريع</b>
  <small>منصة مدرستي — الحصص غير المرصودة لليوم</small>
</header>
<main>
  <label class="opt" id="optAll"><input type="radio" name="mode" value="all"> ✅ جميع الطلاب حاضرون</label>
  <label class="opt" id="optAbs"><input type="radio" name="mode" value="abs"> ⚠️ يوجد غياب</label>
  <div id="absBox">
    <div class="hint">اسم كل غائب في سطر (الاسم الأول واسم الأب على الأقل):</div>
    <textarea id="names" placeholder="مثال:&#10;محمد أحمد&#10;خالد سعد"></textarea>
    <button id="rep" style="background:transparent;color:var(--mut);border:1px dashed var(--line);margin-top:6px;padding:6px;font-weight:normal">تقرير الغياب لهذه الجلسة</button>
  </div>
  <button id="quick">⚡ رصد كل غير المرصود الآن</button>
  <button id="open">فتح لوحة الرصد التفصيلية</button>
  <div id="status"></div>
</main>
<footer>إعداد وتطوير: عبدالمجيد السيد</footer>
<script src="popup.js"></script>
</body>
</html>
